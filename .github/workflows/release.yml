name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: ferris
            asset_name: ferris-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: ferris
            asset_name: ferris-linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: ferris
            asset_name: ferris-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: ferris
            asset_name: ferris-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: ferris.exe
            asset_name: ferris-windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        working-directory: cli
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi
        shell: bash

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp cli/target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          generate_release_notes: true
