[package]
name = "ferris-cli"
version = "0.2.0"
edition = "2021"
authors = ["iskurama <admin@ferris.uz>"]
description = "High-performance systems engineering & developer infrastructure CLI for Ferris.uz"
license = "MIT OR Apache-2.0"
homepage = "https://ferris.uz"
repository = "https://github.com/iskurama/ferris-uz"
documentation = "https://doc.ferris.uz"
readme = "README.md"
keywords = ["ferris", "cli", "systems", "rust", "uzbekistan"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ferris"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
chrono = "0.4.45"
blake3 = "1.5"
